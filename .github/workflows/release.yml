# Release from CI (manual): tag the commit v<MARKETING_VERSION>, then run this workflow on that tag
# (gh workflow run release.yml --ref v<version>). Releases are normally cut locally with scripts/release.sh,
# which pushes the tag itself, so tag pushes do not trigger this. It builds, signs with the
# Developer ID, notarizes, staples, uploads Thermals-<version>.zip as a release in the public tap
# radkode/homebrew-thermals and updates Casks/thermals.rb there (scripts/release.sh --ci).
#
# Secrets (the same Developer ID and notary key that sign DailyDeck; see dailydeck-macos release.yml):
#   DEVELOPER_ID_CERT_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_CERT_PASSWORD     password for that .p12
#   KEYCHAIN_PASSWORD              any throwaway password for the temporary CI keychain
#   NOTARY_KEY_P8_BASE64           base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID                  the API key's Key ID
#   NOTARY_KEY_ISSUER              the API key's Issuer ID
#   TAP_TOKEN                      fine-grained token with Contents: read and write on radkode/homebrew-thermals

name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt with no TTY and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Stage notary key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and publish to the tap
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: ./scripts/release.sh --ci

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
