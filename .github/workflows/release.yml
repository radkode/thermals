# Release: bump MARKETING_VERSION in project.yml and push to main. When that version has no v<version>
# tag yet, this builds, signs with the Developer ID, notarizes, staples, uploads Thermals-<version>.zip
# as a release in the public tap radkode/homebrew-thermals, updates Casks/thermals.rb there, and tags
# v<version> here (scripts/release.sh --ci). Pushes that don't change the version are a no-op.
#
# Secrets (set once with scripts/set-release-secrets.sh):
#   DEVELOPER_ID_CERT_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_CERT_PASSWORD     password for that .p12
#   KEYCHAIN_PASSWORD              any throwaway password for the temporary CI keychain
#   NOTARY_KEY_P8_BASE64           base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID                  the API key's Key ID
#   NOTARY_KEY_ISSUER              the API key's Issuer ID
#   TAP_TOKEN                      fine-grained token with Contents: read and write on radkode/homebrew-thermals
#   SPARKLE_ED_PRIVATE_KEY         Sparkle EdDSA private key that signs the update zip (see docs/releasing.md)

name: Release

on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' project.yml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install XcodeGen 2.46.0
        run: |
          xcodebuild -version
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a UI prompt with no TTY and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Stage notary key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, publish to the tap and tag
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/release.sh --ci

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
