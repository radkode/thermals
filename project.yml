name: Thermals
options:
  bundleIdPrefix: com.radkode
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Thermals:
    type: application
    platform: macOS
    sources:
      - Thermals
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Thermals/Info.plist
      properties:
        CFBundleDisplayName: Thermals
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        ATSApplicationFontsPath: "."
        SUFeedURL: https://github.com/radkode/homebrew-thermals/releases/latest/download/appcast.xml
        SUPublicEDKey: 2DAa6zgJ+e+bkkW2zpdhfToM4QeViebrtAE7Rj3iPjk=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radkode.thermals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  ThermalsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ThermalsTests]
    dependencies:
      - target: Thermals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radkode.thermals.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
schemes:
  Thermals:
    build:
      targets:
        Thermals: all
    test:
      targets: [ThermalsTests]
